<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css" type="text/css">
    <title>Mi Sitio Web Personal</title>
</head>
<body>
    <header>
        <!-- MODO DE DARK Y LIGHT de Universe.io -->
        <div class="theme-switch-wrapper">
            <label class="switch" for="switch">
                <input id="switch" type="checkbox" class="circle" />
                <svg viewBox="0 0 384 512" xmlns="http://www.w3.org/2000/svg" class="moon svg">
                    <path d="M223.5 32C100 32 0 132.3 0 256S100 480 223.5 480c60.6 0 115.5-24.2 155.8-63.4c5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6c-96.9 0-175.5-78.8-175.5-176c0-65.8 36-123.1 89.3-153.3c6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"></path>
                </svg>
                <div class="sun svg">
                    <span class="dot"></span>
                </div>
            </label>
        </div>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="avisos.html">Avisos</a></li>
                <li><a href="sobremi.html">Sobre mí</a></li>
                <li><a href="materias2025.html">Materias 2025</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="contacto-sub">Formulario de Contacto</h1>
        <form class="formulario-sub" id="formularioContacto" novalidate>
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
                <div class="mensaje-error" id="errorNombre"></div>
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>
                <div class="mensaje-error" id="errorCorreo"></div>
            </div>

            <div class="form-group">
                <label for="asunto">Asunto:</label>
                <input type="text" id="asunto" name="asunto" required>
                <div class="mensaje-error" id="errorAsunto"></div>
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" required></textarea>
                <div class="mensaje-error" id="errorMensaje"></div>
            </div>

            <button type="submit">Enviar</button>
        </form>
        <div class="modal-overlay" id="modalExito">
            <div class="mensaje-exito">
                <h2>¡Enviado!</h2>
                <p id="mensajeExito"></p>
                <button class="boton-cerrar" onclick="cerrarModal()">Aceptar</button>
            </div>
        </div>
    </main>
    <footer class="footer">©Uade 2025 Derechos Reservados</footer>
    <script src="./theme.js"></script>
    <script src="./script.js"></script>
</body>
</html>
